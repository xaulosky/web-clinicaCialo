name: Deploy to cPanel via FTP

on:
  push:
    branches:
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build static site
        run: pnpm build

      - name: Prepare ZIP and extractor
        run: |
          mkdir -p deploy-artifacts
          node scripts/create-deploy-zip.js deploy-artifacts/build-cialo.zip
          cp scripts/unzip.php deploy-artifacts/unzip.php

      - name: Upload files by FTP
        run: |
          echo "Uploading ZIP..."
          curl -v --ftp-create-dirs -T deploy-artifacts/build-cialo.zip ftp://216.246.47.183/public_html/build-cialo.zip --user "admin@cialo.cl:${{ secrets.FTP_PASSWORD }}" --ftp-skip-pasv-ip --connect-timeout 30 --max-time 300
          if [ $? -ne 0 ]; then
            echo "ERROR: ZIP upload failed"
            exit 1
          fi

          echo "Uploading PHP extractor..."
          curl -v --ftp-create-dirs -T deploy-artifacts/unzip.php ftp://216.246.47.183/public_html/unzip.php --user "admin@cialo.cl:${{ secrets.FTP_PASSWORD }}" --ftp-skip-pasv-ip --connect-timeout 30 --max-time 120
          if [ $? -ne 0 ]; then
            echo "ERROR: PHP extractor upload failed"
            exit 1
          fi

      - name: Wait for FTP propagation
        run: sleep 10

      - name: Execute remote extractor
        run: |
          RESPONSE=$(curl -sS --max-time 120 https://cialo.cl/unzip.php)
          echo "$RESPONSE"

          if echo "$RESPONSE" | grep -q "ERROR"; then
            echo "ERROR: Extractor reported errors"
            exit 1
          fi

          if echo "$RESPONSE" | grep -q "SUCCESS"; then
            echo "Deploy completed"
          else
            echo "WARNING: Success confirmation was not found"
          fi

      - name: Upload artifact for debugging
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact
          path: deploy-artifacts/build-cialo.zip
